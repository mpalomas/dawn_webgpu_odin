name: Set up Odin
description: Downloads an Odin release and adds it to the PATH.

inputs:
  version:
    description: Odin release tag (https://github.com/odin-lang/Odin/releases)
    default: dev-2026-10

runs:
  using: composite
  steps:
    - name: Download Odin ${{ inputs.version }}
      shell: bash
      env:
        ODIN_VERSION: ${{ inputs.version }}
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   platform=linux-amd64 ;;
          macOS-ARM64) platform=macos-arm64 ;;
          *) echo "::error::no Odin release for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/odin"
        mkdir -p "$dir"
        # The archive holds one directory, odin-<platform>-nightly+<date>/.
        curl -fsSL --retry 3 "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-$platform-$ODIN_VERSION.tar.gz" |
          tar -xz -C "$dir" --strip-components=1
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/odin" version
