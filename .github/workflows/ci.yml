# Checks the generator, the generated bindings and the examples, without Dawn: the examples are only
# type-checked, against this repo's bindings and vendor:wgpu, for Linux, macOS and Windows. Then builds
# the examples against the prebuilt Dawn libraries of the pinned release on each of them (not run: the
# runners have no GPU).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-odin

      # Also checks that wgpu/wgpu_generated.odin matches dawn/include/dawn/webgpu.h.
      - name: Test the generator
        run: odin test tools/gen -out:gen_test.bin

      # Both packages refuse to compile without their library, and type-checking does not link: empty files
      # stand in for them.
      - name: Create placeholder libraries
        run: |
          mkdir -p lib/linux-x86_64 lib/macos-arm64 lib/windows-x86_64
          touch lib/linux-x86_64/libwebgpu_dawn.a lib/linux-x86_64/libwebgpu_dawn.so
          touch lib/macos-arm64/libwebgpu_dawn.a lib/macos-arm64/libwebgpu_dawn.dylib
          touch lib/windows-x86_64/webgpu_dawn.lib lib/windows-x86_64/webgpu_dawn.dll.lib
          vendor_lib="$(odin root)/vendor/wgpu/lib"
          for dir in wgpu-linux-x86_64-release wgpu-macos-aarch64-release; do
            mkdir -p "$vendor_lib/$dir/lib"
            touch "$vendor_lib/$dir/lib/libwgpu_native.a"
          done
          mkdir -p "$vendor_lib/wgpu-windows-x86_64-msvc-release/lib"
          touch "$vendor_lib/wgpu-windows-x86_64-msvc-release/lib/wgpu_native.lib"

      - name: Type-check the package and the examples
        run: |
          vendor="$(odin root)/vendor"
          for target in linux_amd64 darwin_arm64 windows_amd64; do
            echo "::group::$target"
            odin check wgpu -no-entry-point -target:$target
            odin check wgpu -no-entry-point -target:$target -define:DAWN_SHARED=true
            for example in triangle cube; do
              odin check examples/$example -target:$target -collection:gpu=.
              odin check examples/$example -target:$target -collection:gpu="$vendor" -define:DAWN=false
            done
            echo "::endgroup::"
          done

      - name: Check the scripts
        run: |
          shellcheck --severity=warning tools/*.sh
          python3 -m py_compile tools/compare_vendor_wgpu.py

  # On Windows, where Git checks files out with CRLF line endings unless .gitattributes says otherwise.
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-odin

      - name: Test the generator
        run: odin test tools/gen -out:gen_test.exe

      - name: Check the scripts
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Get-ChildItem tools/*.ps1 | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          }
          $issues | Format-Table -AutoSize
          if ($issues) {
            throw "PSScriptAnalyzer: $(@($issues).Count) issue(s)"
          }

  # Fetches the libraries of dawn/release.env, which also checks that they match the committed bindings,
  # and links the examples against them, static and shared.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            flags: -extra-linker-flags:-Wl,--gc-sections
          # macOS 14: the GLFW library of vendor:glfw targets it (the Dawn libraries target 13).
          - runner: macos-latest
            flags: -extra-linker-flags:-Wl,-dead_strip -minimum-os-version:14.0
    name: build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-odin

      # vendor:glfw links the system GLFW on Linux, and ships it for macOS. Odin links with clang, which
      # takes libstdc++ from the newest GCC installed: g++-14 makes sure it is complete.
      - name: Install GLFW and libstdc++
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev g++-14

      - name: Fetch the Dawn libraries
        run: tools/fetch_dawn_libs.sh

      - name: Build the examples
        run: |
          for example in triangle cube; do
            # FLAGS holds several flags.
            # shellcheck disable=SC2086
            odin build examples/$example -collection:gpu=. $FLAGS -out:$example-static.bin
            # shellcheck disable=SC2086
            odin build examples/$example -collection:gpu=. $FLAGS -define:DAWN_SHARED=true -out:$example-shared.bin
          done
          ls -l ./*.bin

  build-windows:
    name: build (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-odin

      - name: Fetch the Dawn libraries
        run: tools/fetch_dawn_libs.ps1

      # link.exe drops unused code by default.
      - name: Build the examples
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($example in 'triangle', 'cube') {
            odin build examples/$example -collection:gpu=. -out:$example-static.exe
            odin build examples/$example -collection:gpu=. -define:DAWN_SHARED=true -out:$example-shared.exe
          }
          Get-ChildItem *.exe | Format-Table Name, Length
