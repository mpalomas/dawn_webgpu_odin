# Weekly: when Chrome stable (Linux) reaches a new milestone, newer than the one pinned in dawn/release.env,
# runs build-dawn.yml for its latest release, which publishes a release and opens a pull request. The patch
# releases of a milestone are skipped, to keep builds rare: build one by hand with build-dawn.yml. Skipped
# too while a release of the milestone exists already, i.e. while its pull request waits for a merge.
name: Update Dawn

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      chrome: ${{ steps.check.outputs.chrome }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compare Chrome stable's milestone with the pinned one
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable="$(tools/dawn_for_chrome.sh --env --platform Linux stable)"
          echo "$stable"
          version="$(sed -n 's/^CHROME_VERSION=//p' <<<"$stable")"
          milestone="${version%%.*}"
          pinned=""
          if [[ -f dawn/release.env ]]; then
            pinned="$(sed -n 's/^CHROME_VERSION=//p' dawn/release.env)"
          fi
          echo "Pinned Chrome version: ${pinned:-none}"
          if [[ -n "$pinned" && "$milestone" -le "${pinned%%.*}" ]]; then
            echo "Up to date: Chrome stable is still milestone ${pinned%%.*}"
            exit 0
          fi
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq ".[].tagName | select(startswith(\"dawn-chrome-$milestone.\"))" | head -n 1)"
          if [[ -n "$existing" ]]; then
            echo "The release $existing exists already: merge its pull request"
            exit 0
          fi
          echo "chrome=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.chrome != ''
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/build-dawn.yml
    with:
      chrome: ${{ needs.check.outputs.chrome }}
      publish: true
